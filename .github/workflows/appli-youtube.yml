name: Appli YouTube

# L'appli YouTube vit dans le dossier AppliYouTube/ de ce depot, a cote de
# Vitamine-D sans y toucher : elle n'emprunte que les secrets App Store
# Connect du depot, eprouves par les envois de Vitamine-D.
#
# Compilation et tests a chaque poussee qui touche le dossier ; envoi vers
# TestFlight sur demande seulement (onglet Actions, « Run workflow »).
on:
  push:
    branches: ["**"]
    paths:
      - "AppliYouTube/**"
      - ".github/workflows/appli-youtube.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: AppliYouTube

jobs:
  test:
    name: Simulateur iOS et extension
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Un seul juge pour tous les appareils
        run: |
          # L'iPhone et l'extension lisent chacun leur copie des consignes ;
          # elles doivent rester identiques.
          cmp AppliYouTube/Resources/consignes.txt extension-brave/consignes.txt             || { echo "consignes.txt differe entre l'appli et l'extension."; exit 1; }

      - name: Eprouver l'extension
        run: node --test extension-brave/tests/

      - name: Choisir un simulateur
        id: sim
        run: |
          # On prend le premier iPhone disponible plutot qu'un modele code en
          # dur : le catalogue des images GitHub change a chaque mise a jour.
          xcodebuild -version
          NAME=$(xcrun simctl list devices available                  | grep -oE 'iPhone [0-9]+[A-Za-z ]*' | head -1 | xargs)
          echo "Simulateur retenu : $NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Compiler et tester
        run: |
          set -o pipefail
          xcodebuild test             -project AppliYouTube.xcodeproj             -scheme AppliYouTube             -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}"             -resultBundlePath TestResults.xcresult             CODE_SIGNING_ALLOWED=NO             | tee build.log

      - name: Conserver les resultats
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultats-appli-youtube
          path: |
            AppliYouTube/TestResults.xcresult
            AppliYouTube/build.log
          retention-days: 14

  testflight:
    name: Envoyer sur TestFlight
    runs-on: macos-latest
    needs: test
    # Sur demande seulement : chaque envoi cree une version chez Apple.
    if: github.event_name == 'workflow_dispatch'

    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.ASC_TEAM_ID || secrets.APPLE_TEAM_ID }}

    steps:
      - uses: actions/checkout@v4

      - name: Verifier que les secrets sont en place
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          manquants=""
          [ -n "$ASC_PRIVATE_KEY" ] || manquants="$manquants ASC_PRIVATE_KEY"
          [ -n "$ASC_KEY_ID" ]      || manquants="$manquants ASC_KEY_ID"
          [ -n "$ASC_ISSUER_ID" ]   || manquants="$manquants ASC_ISSUER_ID"
          [ -n "$APPLE_TEAM_ID" ]   || manquants="$manquants APPLE_TEAM_ID"
          if [ -n "$manquants" ]; then
            echo "Secrets manquants :$manquants"
            echo "A deposer dans Settings > Secrets and variables > Actions."
            echo
            echo "Ce sont les memes secrets que pour Vitamine-D."
            exit 1
          fi
          echo "Les quatre secrets sont presents."

      - name: Deposer la cle d'API
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          # xcodebuild attend la cle sous ce nom precis. Elle vit dans le
          # dossier temporaire de l'executeur, detruit avec la machine.
          mkdir -p "$RUNNER_TEMP/private_keys"
          FICHIER="$RUNNER_TEMP/private_keys/AuthKey_$ASC_KEY_ID.p8"
          printf '%s' "$ASC_PRIVATE_KEY" > "$FICHIER"
          chmod 600 "$FICHIER"

          # Controle de forme, sans jamais afficher la cle.
          souci=0
          head -1 "$FICHIER" | grep -q 'BEGIN PRIVATE KEY' || {
            echo "ASC_PRIVATE_KEY ne commence pas par -----BEGIN PRIVATE KEY-----"; souci=1; }
          openssl pkey -in "$FICHIER" -noout 2>/dev/null || {
            echo "La cle privee est illisible : contenu tronque ou altere."; souci=1; }
          [ "${#ASC_KEY_ID}" -eq 10 ] || {
            echo "ASC_KEY_ID fait ${#ASC_KEY_ID} caracteres, 10 attendus."; souci=1; }
          [ "${#ASC_ISSUER_ID}" -eq 36 ] || {
            echo "ASC_ISSUER_ID fait ${#ASC_ISSUER_ID} caracteres, 36 attendus."; souci=1; }
          [ "$souci" -eq 0 ] || exit 1
          echo "Cle et identifiants bien formes."

      - name: Eprouver les identifiants aupres d'Apple
        run: |
          # Xcode signale un refus 401 au milieu de l'archivage sans dire
          # laquelle des trois valeurs est en cause. Un appel direct le dit en
          # une seconde, et confirme que la fiche est visible par la cle.
          python3 Tools/tester-cle-asc.py \
            "$RUNNER_TEMP/private_keys/AuthKey_$ASC_KEY_ID.p8" \
            "$ASC_KEY_ID" "$ASC_ISSUER_ID" ca.appliyoutube

      - name: Archiver, signe si possible
        run: |
          set -o pipefail
          # Deux chemins, essayes dans l'ordre, parce que le bon depend d'une
          # chose qui ne vit pas dans ce depot : la presence d'un appareil
          # enregistre dans le compte developpeur. Sans appareil, Apple refuse
          # de generer un profil de developpement et la signature echoue.
          #
          # Le repli sans signature est ici sans consequence : l'appli ne
          # declare aucun droit particulier (ni WeatherKit, ni notifications).
          #
          # Le numero de version interne doit croitre a chaque televersement,
          # sans quoi Apple refuse le paquet comme doublon.
          commun=(
            -project AppliYouTube.xcodeproj
            -scheme AppliYouTube
            -configuration Release
            -destination 'generic/platform=iOS'
            -archivePath "$RUNNER_TEMP/AppliYouTube.xcarchive"
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID"
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER"
          )

          if xcodebuild archive "${commun[@]}" \
              -allowProvisioningUpdates \
              -authenticationKeyPath "$RUNNER_TEMP/private_keys/AuthKey_$ASC_KEY_ID.p8" \
              -authenticationKeyID "$ASC_KEY_ID" \
              -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
              CODE_SIGN_STYLE=Automatic; then
            echo "Archive signee."
          else
            echo "::warning::Signature de l'archive impossible — probablement"
            echo "::warning::aucun appareil enregistre dans le compte."
            echo "::warning::Repli sans signature. Sans droits declares, la"
            echo "::warning::version reste complete."
            rm -rf "$RUNNER_TEMP/AppliYouTube.xcarchive"
            xcodebuild archive "${commun[@]}" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY=""
          fi

      - name: Televerser sur TestFlight
        run: |
          set -o pipefail
          # `destination: upload` fait envoyer l'archive directement a App
          # Store Connect par xcodebuild, sans passer par un outil tiers.
          # `manageAppVersionAndBuildNumber` a faux empeche Xcode de reecrire
          # le numero de version qu'on vient de fixer.
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/AppliYouTube.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/private_keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

          echo "Version $GITHUB_RUN_NUMBER envoyee. Apple met dix a trente"
          echo "minutes a la traiter avant qu'elle apparaisse dans TestFlight."

      - name: Effacer la cle
        if: always()
        run: rm -rf "$RUNNER_TEMP/private_keys"
