name: Compilation et tests

# Les exécuteurs macOS de GitHub fournissent le Mac que le projet exige.
# Gratuit sur un dépôt public ; sur un dépôt privé, les minutes macOS sont
# décomptées au tarif ×10 du quota mensuel.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Simulateur iOS
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Environnement
        run: |
          xcodebuild -version
          echo "--- simulateurs iOS disponibles ---"
          xcrun simctl list devices available | grep -A 20 "iOS" | head -30

      - name: Choisir un simulateur
        id: sim
        run: |
          # On prend le premier iPhone disponible plutôt qu'un modèle codé en
          # dur : le catalogue des images GitHub change à chaque mise à jour.
          NAME=$(xcrun simctl list devices available \
                 | grep -oE 'iPhone [0-9]+[A-Za-z ]*' | head -1 | xargs)
          echo "Simulateur retenu : $NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Compiler et tester
        run: |
          set -o pipefail
          xcodebuild test \
            -project VitamineD.xcodeproj \
            -scheme VitamineD \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | tee build.log

      - name: Conserver les résultats
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultats-tests
          path: |
            TestResults.xcresult
            build.log
          retention-days: 14

  captures:
    name: Captures d'écran
    runs-on: macos-latest
    # Uniquement sur demande. Sur un dépôt privé, chaque minute d'exécuteur
    # macOS est décomptée au décuple du quota mensuel : lancer ce job à chaque
    # poussée consommerait le forfait en quelques jours, pour des images qui ne
    # changent qu'au gré des retouches d'interface.
    #
    # Le bouton « Run workflow » n'apparaît qu'une fois le workflow présent sur
    # la branche par défaut. En attendant, un marqueur dans le message de
    # commit fait le même office.
    if: >-
      github.event_name == 'workflow_dispatch'
      || contains(github.event.head_commit.message, '[captures]')
    steps:
      - uses: actions/checkout@v4

      - name: Compiler l'application
        run: |
          set -o pipefail
          xcodebuild build \
            -project VitamineD.xcodeproj \
            -scheme VitamineD \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO

      - name: Démarrer un simulateur
        run: |
          UDID=$(xcrun simctl list devices available -j \
                 | jq -r '[.devices[][] | select(.isAvailable) | select(.name | startswith("iPhone"))][0].udid')
          test -n "$UDID" && test "$UDID" != null || { echo "aucun iPhone disponible"; exit 1; }
          echo "Simulateur : $UDID"
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          # Barre d'état figée : sans cela, l'heure et la batterie du serveur
          # apparaissent dans les captures.
          xcrun simctl status_bar "$UDID" override \
            --time "13:00" --batteryState charged --batteryLevel 100 \
            --cellularBars 4 --wifiBars 3 || true

      - name: Installer et photographier chaque écran
        run: |
          set -e
          BUNDLE=ca.gphparent.VitamineD
          APP=$(find DerivedData/Build/Products -maxdepth 2 -name 'VitamineD.app' | head -1)
          echo "Application : $APP"
          xcrun simctl install "$UDID" "$APP"
          mkdir -p captures

          # Montréal, pour que les chiffres affichés soient ceux d'un lieu réel.
          LIEU="45.5019,-73.5674,Montréal"

          for onglet in today session history profile; do
            xcrun simctl terminate "$UDID" "$BUNDLE" 2>/dev/null || true
            # `-vdInstant midi` place l'horloge au midi solaire du lieu : sans
            # cela, la capture est prise à l'heure où le serveur veut bien
            # tourner, souvent en pleine nuit sur le fuseau visé.
            xcrun simctl launch "$UDID" "$BUNDLE" \
              -vdLieu "$LIEU" -vdOnglet "$onglet" -vdInstant midi
            # Laisse le temps aux deux requêtes météo d'aboutir et à la vue de
            # se poser.
            sleep 14
            xcrun simctl io "$UDID" screenshot "captures/$onglet.png"
            echo "capturé : $onglet"
          done

          cat > captures/LISEZ-MOI.txt <<'NOTE'
          Captures produites automatiquement dans un simulateur iPhone.

          L'horloge de l'application a été placée au midi solaire de Montréal,
          sinon la capture tomberait à l'heure d'exécution du serveur — souvent
          en pleine nuit sur ce fuseau, où l'application affiche à juste titre
          qu'il n'y a rien à récolter.

          L'onglet Historique est vide : aucune sortie n'a jamais été
          enregistrée sur ce simulateur, qui est recréé à chaque exécution.
          NOTE

      - name: Publier les captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captures-ecran
          path: captures/*
          retention-days: 14

  ipa:
    name: Paquet installable
    runs-on: macos-latest
    # Même logique de coût que les captures : sur demande seulement.
    if: >-
      github.event_name == 'workflow_dispatch'
      || contains(github.event.head_commit.message, '[ipa]')

    steps:
      - uses: actions/checkout@v4

      - name: Compiler pour appareil, sans signature
        run: |
          set -o pipefail
          # Aucune signature ici : c'est AltStore qui signera le paquet avec
          # l'identifiant Apple de l'utilisateur au moment de l'installation.
          # L'application ne réclame aucun droit particulier — position et
          # notifications passent par de simples chaînes d'explication dans
          # l'Info.plist — donc rien n'exige un compte développeur payant.
          xcodebuild build \
            -project VitamineD.xcodeproj \
            -scheme VitamineD \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Emballer en .ipa
        run: |
          set -e
          APP=$(find DerivedData/Build/Products/Release-iphoneos \
                     -maxdepth 1 -name 'VitamineD.app' | head -1)
          test -n "$APP" || { echo "application introuvable"; exit 1; }
          echo "Application : $APP"

          # Un .ipa n'est rien d'autre qu'une archive zip contenant un dossier
          # Payload, lui-même contenant le paquet .app.
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry VitamineD.ipa Payload
          ls -lh VitamineD.ipa

      - name: Publier le paquet
        uses: actions/upload-artifact@v4
        with:
          name: VitamineD-ipa
          path: VitamineD.ipa
          retention-days: 30

  testflight:
    name: Publier sur TestFlight
    runs-on: macos-latest
    # Sur demande : chaque téléversement crée une version chez Apple, et rien
    # n'oblige à en produire une à chaque commit.
    if: >-
      github.event_name == 'workflow_dispatch'
      || contains(github.event.head_commit.message, '[testflight]')

    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

    steps:
      - uses: actions/checkout@v4

      - name: Déposer la clé d'API
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          # xcodebuild attend la clé sous ce nom précis. Elle vit dans le
          # dossier temporaire de l'exécuteur, détruit avec la machine.
          mkdir -p "$RUNNER_TEMP/private_keys"
          printf '%s' "$ASC_PRIVATE_KEY" > "$RUNNER_TEMP/private_keys/AuthKey_$ASC_KEY_ID.p8"
          chmod 600 "$RUNNER_TEMP/private_keys/AuthKey_$ASC_KEY_ID.p8"

      - name: Archiver
        run: |
          set -o pipefail
          # Le numéro de version interne doit croître à chaque téléversement,
          # sans quoi Apple refuse le paquet comme doublon. Le compteur
          # d'exécutions de GitHub s'en charge et ne recule jamais.
          xcodebuild archive \
            -project VitamineD.xcodeproj \
            -scheme VitamineD \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/VitamineD.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/private_keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER"

      - name: Exporter et téléverser
        run: |
          set -o pipefail
          # `destination: upload` fait envoyer l'archive directement à App
          # Store Connect par xcodebuild, sans passer par un outil tiers.
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/VitamineD.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/private_keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

          echo "Version $GITHUB_RUN_NUMBER envoyée. Apple met dix à trente"
          echo "minutes à la traiter avant qu'elle apparaisse dans TestFlight."

      - name: Conserver les journaux en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: journaux-testflight
          path: |
            /Users/runner/Library/Logs/gym
            ${{ runner.temp }}/export
          retention-days: 7
          if-no-files-found: ignore
