name: PP Terrain

# L'appli PP Terrain vit dans le dossier PPTerrain/ de ce depot, a cote de
# Vitamine-D sans y toucher : elle n'emprunte que les secrets App Store
# Connect du depot, comme l'appli YouTube.
#
# Guillaume ne lance rien lui-meme : chaque poussee sur main qui touche le
# dossier compile, teste, puis envoie la version sur TestFlight.
on:
  push:
    branches: ["**"]
    paths:
      - "PPTerrain/**"
      - ".github/workflows/pp-terrain.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: PPTerrain

jobs:
  test:
    name: Simulateur iOS
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Choisir un simulateur
        id: sim
        run: |
          xcodebuild -version
          NAME=$(xcrun simctl list devices available \
                 | grep -oE 'iPhone [0-9]+[A-Za-z ]*' | head -1 | xargs)
          echo "Simulateur retenu : $NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Compiler et tester
        run: |
          set -o pipefail
          xcodebuild test \
            -project PPTerrain.xcodeproj \
            -scheme PPTerrain \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | tee build.log

      - name: Conserver les resultats
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultats-pp-terrain
          path: |
            PPTerrain/TestResults.xcresult
            PPTerrain/build.log
          retention-days: 14

  testflight:
    name: Envoyer sur TestFlight
    runs-on: macos-latest
    needs: test
    # La branche principale seulement : chaque envoi cree une version chez Apple.
    if: github.ref == 'refs/heads/main'

    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.ASC_TEAM_ID || secrets.APPLE_TEAM_ID }}

    steps:
      - uses: actions/checkout@v4

      - name: Verifier que les secrets sont en place
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          manquants=""
          [ -n "$ASC_PRIVATE_KEY" ] || manquants="$manquants ASC_PRIVATE_KEY"
          [ -n "$ASC_KEY_ID" ]      || manquants="$manquants ASC_KEY_ID"
          [ -n "$ASC_ISSUER_ID" ]   || manquants="$manquants ASC_ISSUER_ID"
          [ -n "$APPLE_TEAM_ID" ]   || manquants="$manquants APPLE_TEAM_ID"
          if [ -n "$manquants" ]; then
            echo "Secrets manquants :$manquants"
            exit 1
          fi
          echo "Les quatre secrets sont presents."

      - name: Deposer la cle d'API
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/private_keys"
          FICHIER="$RUNNER_TEMP/private_keys/AuthKey_$ASC_KEY_ID.p8"
          printf '%s' "$ASC_PRIVATE_KEY" > "$FICHIER"
          chmod 600 "$FICHIER"
          openssl pkey -in "$FICHIER" -noout 2>/dev/null || {
            echo "La cle privee est illisible."; exit 1; }

      - name: Eprouver les identifiants aupres d'Apple
        run: |
          # Confirme aussi que la fiche « PP Terrain » existe dans App Store Connect.
          python3 Tools/tester-cle-asc.py \
            "$RUNNER_TEMP/private_keys/AuthKey_$ASC_KEY_ID.p8" \
            "$ASC_KEY_ID" "$ASC_ISSUER_ID" ca.gphparent.PPTerrain

      - name: Archiver, signe si possible
        run: |
          set -o pipefail
          # Le numero de version interne doit croitre a chaque envoi, sans
          # quoi Apple refuse le paquet comme doublon. Le decalage le garde
          # au-dessus de tout numero deja employe par ce depot.
          commun=(
            -project PPTerrain.xcodeproj
            -scheme PPTerrain
            -configuration Release
            -destination 'generic/platform=iOS'
            -archivePath "$RUNNER_TEMP/PPTerrain.xcarchive"
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID"
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER"
          )

          if xcodebuild archive "${commun[@]}" \
              -allowProvisioningUpdates \
              -authenticationKeyPath "$RUNNER_TEMP/private_keys/AuthKey_$ASC_KEY_ID.p8" \
              -authenticationKeyID "$ASC_KEY_ID" \
              -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
              CODE_SIGN_STYLE=Automatic; then
            echo "Archive signee."
          else
            echo "::warning::Signature de l'archive impossible, repli sans signature."
            rm -rf "$RUNNER_TEMP/PPTerrain.xcarchive"
            xcodebuild archive "${commun[@]}" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY=""
          fi

      - name: Televerser sur TestFlight
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/PPTerrain.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/private_keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

          echo "Version $GITHUB_RUN_NUMBER envoyee. Apple met dix a trente"
          echo "minutes a la traiter avant qu'elle apparaisse dans TestFlight."

      - name: Effacer la cle
        if: always()
        run: rm -rf "$RUNNER_TEMP/private_keys"
